# XDK 2.0.2135 Direct3D, as statically linked into RR6's default.xex.
#
# Identified from the codegen output (scripts/re/funcdb.py) by behaviour, not
# by signature matching: the kernel Vd* imports, the shader table walked by
# the game's loader at 0x82222900, and the device fields each function
# touches. Blue Dragon's names (reblue config/functions.toml) are reused where
# the function is the same API, but the XDK differs, so no address or size
# carries over.
#
# D3DDevice layout (allocation 0x5080, Direct3D_CreateDevice):
#   +0x0000  ring write pointer (+0x0008 limit, compared by D3D__MakeSpace)
#   +0x000C  device reference count (D3DDevice_Release)
#   +0x0010  dirty masks, u64s at +0x18..+0x30
#   +0x0060  m_SetRenderStateCall[97]    +0x0234 m_GetRenderStateCall[97]
#   +0x01E4  m_SetSamplerStateCall[20]   +0x03B8 m_GetSamplerStateCall[20]
#            seeded from {Get, Set, Default} tables at 0x823763E0 (render,
#            97 entries) and 0x82376870 (sampler, 20 entries) by 0x822612B0
#   +0x0480  fetch constants, 32 x 24 bytes (D3DDevice_SetTexture)
#   +0x0780  VS float constants c0..c255 (D3DDevice_SetVertexShaderConstantF)
#   +0x1780  PS float constants c0..c255 (D3DDevice_SetPixelShaderConstantF)
#            shader literals land at +0x0480 + their container address
#   +0x28C0  flags byte (bit 0x80 tested by EndVertices / MakeSpace)
#   +0x2C90  vertex declaration          +0x2D14 index offset (draws)
#   +0x2D48  viewport scale/offset floats
#   +0x30F4  index buffer                +0x30F8 render targets[4]
#   +0x3108  depth stencil surface       +0x310C streams[16] {offset, vb}
#   +0x3190  stream strides (bytes, /4)  +0x31A0 textures[26]
#   +0x3208  viewport {X, Y, W, H, MinZ, MaxZ}
#   +0x3220  scissor rect                +0x3230 clip planes[] float4
#   +0x3290  pixel shader                +0x4FE8 vertex shader
#   +0x5060  creation behavior flags

